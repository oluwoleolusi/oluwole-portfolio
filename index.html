<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oluwole Olusi — Full-Stack Developer</title>
    <meta
      name="description"
      content="Oluwole Olusi is a full-stack developer based in Lagos, Nigeria, working across frontend, backend, and UI/graphic design. View selected work in hospitality, e-commerce, creative branding, and SaaS product design."
    />
    <meta property="og:title" content="Oluwole Olusi — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer and designer based in Lagos, Nigeria. Selected work across hospitality, e-commerce, branding, and SaaS product design."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="projectType">
        <option value="">Select a project type</option>
        <option value="Website">Website</option>
        <option value="Web application">Web application</option>
        <option value="E-commerce">E-commerce</option>
        <option value="UI / graphic design">UI / graphic design</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
      <input
        type="hidden"
        name="subject"
        value="New project inquiry from your portfolio"
      />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
